spring.application.name=simple-soap-client

# Server configuration
server.port=8080
server.servlet.context-path=/

# Jetty-specific settings
server.jetty.threads.acceptors=2
server.jetty.threads.selectors=4
server.jetty.threads.max=200
server.jetty.threads.min=10
server.jetty.threads.idle-timeout=60000

# Connection settings
server.jetty.connection-idle-timeout=30000